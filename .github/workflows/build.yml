name: Build and accessibility

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-a11y:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Production build
        run: npm run build
      - name: Install Chromium for browser tests
        run: npx playwright install --with-deps chromium
      - name: WCAG and responsive smoke tests
        run: npm run test:a11y
      - name: Upload build and test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gris-build-and-a11y
          path: |
            dist/
            playwright-report/
            test-results/
          if-no-files-found: warn
